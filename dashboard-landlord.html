<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Listings — VarsityStay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .listing-card { background:#fff; border:1px solid var(--gray-200); border-radius:16px; padding:20px; }
    .listing-card .name { font-weight:700; }
    .listing-card .meta { color:var(--gray-500); font-size:13px; margin-top:2px; }
  </style>
</head>
<body>
  <div class="page">
    <div id="nav-placeholder"></div>
    <main class="main" style="background:var(--gray-50)">
      <div class="container" style="padding-top:32px;padding-bottom:60px">
        <div class="dash-header">
          <div>
            <h1>My Listings</h1>
            <p id="signed-in-as">Loading…</p>
          </div>
          <button class="btn btn-ghost" id="logout-btn">Log out</button>
        </div>
        <div id="listings-container"></div>
      </div>
    </main>
  </div>

  <script src="js/lib/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script>
    document.getElementById('logout-btn').addEventListener('click', logOut);

    async function loadDashboard() {
      const user = await requireAuth();
      if (!user) return;

      const profile = await getCurrentProfile();
      document.getElementById('signed-in-as').textContent = `Signed in as ${profile?.full_name || ''}`;

      const { data: properties } = await supabaseClient
        .from('properties')
        .select('*')
        .eq('landlord_id', user.id);

      const container = document.getElementById('listings-container');

      if (!properties || properties.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <p>You haven't listed a property yet.</p>
            <p style="font-size:13px;color:var(--gray-400);margin-top:4px">Adding listings is coming in Week 2.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = `<div class="grid">` + properties.map(p => `
        <div class="listing-card">
          <div class="name">${p.name}</div>
          <div class="meta">R${Number(p.monthly_rent).toLocaleString()}/mo · ${p.available ? 'Available' : 'Unavailable'}</div>
        </div>
      `).join('') + `</div>`;
    }
    loadDashboard();
  </script>
</body>
</html>
