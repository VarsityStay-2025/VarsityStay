<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — VarsityStay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="page">
    <div id="nav-placeholder"></div>
    <main class="main" style="background:var(--gray-50)">
      <div class="form-card">
        <h1>Welcome back</h1>
        <p class="form-sub">Log in to manage your stay or your listings.</p>

        <div class="error-box hidden" id="error-box"></div>

        <form id="login-form">
          <input class="field" name="email" type="email" placeholder="Email address" required>
          <input class="field" name="password" type="password" placeholder="Password" required>
          <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px">Log in</button>
        </form>

        <p class="form-footer">Don't have an account? <a href="signup.html">Sign up</a></p>
      </div>
    </main>
  </div>

  <script src="js/lib/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('error-box');
      errorBox.classList.add('hidden');
      const fd = new FormData(e.target);

      try {
        const profile = await logIn({ email: fd.get('email'), password: fd.get('password') });
        window.location.href = profile?.role === 'landlord' ? 'dashboard-landlord.html' : 'dashboard-student.html';
      } catch (err) {
        errorBox.textContent = err.message || 'Invalid login.';
        errorBox.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
